<!DOCTYPE html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Notificación Masiva | Reciclame</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary": "#ffffff", "secondary-fixed": "#c3ecd7",
                        "surface-container-high": "#dce9ff", "surface-container-lowest": "#ffffff",
                        "surface-container": "#e5eeff", "on-primary-fixed-variant": "#3f465c",
                        "on-background": "#0b1c30", "inverse-surface": "#213145",
                        "on-tertiary-container": "#3980f4", "on-secondary-container": "#476c5b",
                        "inverse-on-surface": "#eaf1ff", "on-error": "#ffffff",
                        "surface-bright": "#f8f9ff", "on-tertiary": "#ffffff",
                        "surface-tint": "#565e74", "background": "#f8f9ff",
                        "surface-dim": "#cbdbf5", "on-tertiary-fixed-variant": "#004395",
                        "tertiary-container": "#001a42", "on-error-container": "#93000a",
                        "on-surface-variant": "#45464d", "primary-container": "#131b2e",
                        "on-secondary-fixed": "#002115", "error": "#ba1a1a",
                        "outline-variant": "#c6c6cd", "secondary-fixed-dim": "#a8cfbc",
                        "on-primary-container": "#7c839b", "tertiary-fixed-dim": "#adc6ff",
                        "primary": "#000000", "secondary": "#006d37",
                        "surface-container-highest": "#d3e4fe", "on-tertiary-fixed": "#001a42",
                        "surface-variant": "#d3e4fe", "surface-container-low": "#eff4ff",
                        "primary-fixed-dim": "#bec6e0", "on-primary-fixed": "#131b2e",
                        "on-secondary-fixed-variant": "#294e3f", "error-container": "#ffdad6",
                        "primary-fixed": "#dae2fd", "outline": "#76777d",
                        "on-surface": "#0b1c30", "inverse-primary": "#bec6e0",
                        "secondary-container": "#c3ecd7", "on-primary": "#ffffff",
                        "tertiary-fixed": "#d8e2ff", "surface": "#f8f9ff", "tertiary": "#000000"
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    fontFamily: {
                        headline: ["Plus Jakarta Sans", "system-ui", "sans-serif"],
                        body: ["Inter", "system-ui", "sans-serif"],
                        label: ["Inter", "system-ui", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-20px); opacity: 0; } }
        .flash-slide-in { animation: slideIn 0.3s ease-out; }
        .flash-slide-out { animation: slideOut 0.3s ease-out forwards; }
    </style>
    <div th:replace="~{fragments/responsive}"></div>
</head>

<body class="bg-surface text-on-surface font-body h-screen flex overflow-hidden selection:bg-secondary-container selection:text-on-secondary-container">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="flex-1 flex flex-col min-w-0 bg-surface relative">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-1 overflow-y-auto px-6 py-5">

        <!-- Centrado container -->
        <div class="w-full max-w-2xl mx-auto">

            <!-- Flash messages -->
            <div th:if="${exito}" id="flash-success"
                 class="mb-4 flex items-center gap-3 rounded-xl bg-green-50 border border-green-200 px-4 py-3 text-green-800 text-sm flash-slide-in">
                <span class="material-symbols-outlined text-green-600 flex-shrink-0" style="font-size:20px">check_circle</span>
                <span th:text="${exito}"></span>
                <button type="button" onclick="cerrarFlash(this)" class="ml-auto text-green-600 hover:text-green-700">
                    <span class="material-symbols-outlined" style="font-size:18px">close</span>
                </button>
            </div>
            <div th:if="${error}" id="flash-error"
                 class="mb-4 flex items-center gap-3 rounded-xl bg-red-50 border border-red-200 px-4 py-3 text-red-800 text-sm flash-slide-in">
                <span class="material-symbols-outlined text-red-600 flex-shrink-0" style="font-size:20px">error</span>
                <span th:text="${error}"></span>
                <button type="button" onclick="cerrarFlash(this)" class="ml-auto text-red-600 hover:text-red-700">
                    <span class="material-symbols-outlined" style="font-size:18px">close</span>
                </button>
            </div>

            <!-- Header -->
            <div class="mb-6 text-center">
                <div class="flex items-center justify-center gap-3 mb-2">
                    <span class="material-symbols-outlined text-secondary" style="font-size:32px">mail_outline</span>
                    <h2 class="font-extrabold text-[1.875rem] text-on-primary-fixed leading-tight tracking-tight">
                        Notificación masiva
                    </h2>
                </div>
                <p class="text-sm text-on-surface-variant">
                    Redacta y envía una notificación a todos los usuarios de los roles seleccionados.
                </p>
            </div>

            <!-- Form card -->
            <div class="bg-white rounded-2xl shadow-sm border border-outline-variant/30 p-6 sm:p-8">
            <form th:action="@{/admin/notificaciones/masiva}" method="post" onsubmit="return validarFormulario()">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Título -->
                <div class="mb-5">
                    <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1.5">
                        Título <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="titulo" id="inputTitulo" maxlength="150" required
                           placeholder="Ej: Nuevo estudio disponible"
                           class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-transparent focus:bg-white focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all text-sm font-medium"/>
                </div>

                <!-- Mensaje -->
                <div class="mb-5">
                    <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1.5">
                        Mensaje <span class="text-red-500">*</span>
                    </label>
                    <textarea name="mensaje" id="inputMensaje" rows="4" maxlength="500" required
                              placeholder="Escribe el contenido de la notificación..."
                              class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-transparent focus:bg-white focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all text-sm font-medium resize-none"></textarea>
                    <p class="text-[11px] text-on-surface-variant mt-1">Máximo 500 caracteres.</p>
                </div>

                <!-- Tipo -->
                <div class="mb-5">
                    <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1.5">
                        Tipo
                    </label>
                    <select name="tipo"
                            class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-transparent focus:bg-white focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all text-sm font-medium">
                        <option value="INFO">Informativa</option>
                        <option value="ALERTA">Alerta</option>
                        <option value="EXITO">Éxito</option>
                        <option value="SISTEMA">Sistema</option>
                    </select>
                </div>

                <!-- Enlace opcional -->
                <div class="mb-6">
                    <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1.5">
                        Enlace de referencia <span class="text-on-surface-variant/50 font-normal normal-case">(opcional)</span>
                    </label>
                    <input type="text" name="enlace" maxlength="255"
                           placeholder="Ej: /admin/estudios"
                           class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-transparent focus:bg-white focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all text-sm font-medium"/>
                </div>

                <!-- Roles destinatarios -->
                <div class="mb-7">
                    <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-3">
                        Enviar a <span class="text-red-500">*</span>
                    </label>
                    <div id="rolesError" class="hidden mb-3 text-xs text-red-600 font-medium">
                        Debes seleccionar al menos un rol.
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">

                        <!-- SOCIO -->
                        <label class="flex items-center gap-3 p-4 rounded-xl border-2 border-outline-variant/40 bg-surface-container-low hover:border-secondary/50 hover:bg-secondary-container/30 cursor-pointer transition-all has-[:checked]:border-secondary has-[:checked]:bg-secondary-container/40">
                            <input type="checkbox" name="roles" value="3" class="h-4 w-4 rounded text-secondary focus:ring-secondary/30"/>
                            <div>
                                <p class="text-sm font-bold text-on-surface">Socio</p>
                                <p class="text-[11px] text-on-surface-variant">Usuarios socios</p>
                            </div>
                        </label>

                        <!-- VISUALIZADOR -->
                        <label class="flex items-center gap-3 p-4 rounded-xl border-2 border-outline-variant/40 bg-surface-container-low hover:border-secondary/50 hover:bg-secondary-container/30 cursor-pointer transition-all has-[:checked]:border-secondary has-[:checked]:bg-secondary-container/40">
                            <input type="checkbox" name="roles" value="4" class="h-4 w-4 rounded text-secondary focus:ring-secondary/30"/>
                            <div>
                                <p class="text-sm font-bold text-on-surface">Visualizador</p>
                                <p class="text-[11px] text-on-surface-variant">Usuarios visualizadores</p>
                            </div>
                        </label>

                        <!-- ADMIN -->
                        <label class="flex items-center gap-3 p-4 rounded-xl border-2 border-outline-variant/40 bg-surface-container-low hover:border-secondary/50 hover:bg-secondary-container/30 cursor-pointer transition-all has-[:checked]:border-secondary has-[:checked]:bg-secondary-container/40">
                            <input type="checkbox" name="roles" value="2" class="h-4 w-4 rounded text-secondary focus:ring-secondary/30"/>
                            <div>
                                <p class="text-sm font-bold text-on-surface">Admin</p>
                                <p class="text-[11px] text-on-surface-variant">Otros administradores</p>
                            </div>
                        </label>

                    </div>
                </div>

                <!-- Botones -->
                <div class="flex flex-col sm:flex-row gap-3">
                    <button type="submit"
                            class="flex-1 py-3 rounded-full bg-secondary text-white text-sm font-bold flex items-center justify-center gap-2 hover:bg-green-800 transition-colors">
                        <span class="material-symbols-outlined" style="font-size:18px">send</span>
                        Enviar notificación
                    </button>
                    <a th:href="@{/admin/notificaciones}"
                       class="flex-1 py-3 rounded-full bg-surface-container text-on-surface-variant text-sm font-bold flex items-center justify-center gap-2 hover:bg-surface-container-high transition-colors">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>

        </div>
    </main>
</div>

<script>
    function validarFormulario() {
        const roles = document.querySelectorAll('input[name="roles"]:checked');
        if (roles.length === 0) {
            document.getElementById('rolesError').classList.remove('hidden');
            return false;
        }
        document.getElementById('rolesError').classList.add('hidden');
        return true;
    }

    function cerrarFlash(btn) {
        const flash = btn.closest('[id^="flash-"]');
        if (flash) {
            flash.classList.remove('flash-slide-in');
            flash.classList.add('flash-slide-out');
            setTimeout(() => flash.remove(), 300);
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        const flashSuccess = document.getElementById('flash-success');
        const flashError = document.getElementById('flash-error');

        if (flashSuccess) {
            setTimeout(() => {
                flashSuccess.classList.remove('flash-slide-in');
                flashSuccess.classList.add('flash-slide-out');
                setTimeout(() => flashSuccess.remove(), 300);
            }, 4000);
        }

        if (flashError) {
            setTimeout(() => {
                flashError.classList.remove('flash-slide-in');
                flashError.classList.add('flash-slide-out');
                setTimeout(() => flashError.remove(), 300);
            }, 6000);
        }
    });
</script>

</body>
</html>
