<!DOCTYPE html>

<html lang="es"><head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Nuevo Estudio - Panel de Administración</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-surface text-on-surface font-body h-screen flex overflow-hidden">
  <div class="flex h-screen w-full">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="flex-1 flex flex-col min-w-0 bg-[#1e293b] overflow-y-auto">
      <div th:replace="~{fragments/navbar :: navbar}"></div>
      <div class="flex-1 flex items-center justify-center p-0 sm:p-4 md:p-10">
        <!-- Modal Container -->
        <!-- BEGIN: Main Modal Container -->
        <main class="w-full max-w-[800px] bg-white rounded-none sm:rounded-2xl shadow-2xl flex flex-col max-h-screen sm:max-h-[90vh] overflow-hidden relative" data-purpose="modal-container">
  <!-- BEGIN: Modal Header -->
  <header class="flex items-center justify-between px-6 py-5 border-b border-gray-100 bg-white sticky top-0 z-30">
    <div class="flex items-center gap-4">
      <!-- Icon Container -->
      <div class="w-10 h-10 rounded-lg bg-[#e0e7ff] flex items-center justify-center text-[#064e3b]">
        <svg class="w-6 h-6" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 18H17M7 14H17M7 10H11M13 3H7C5.89543 3 5 3.89543 5 5V19C5 20.1046 5.89543 21 7 21H17C18.1046 21 19 20.1046 19 19V9L13 3Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-extrabold text-[#0f172a] tracking-tight">Nuevo Estudio</h1>
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">PANEL DE ADMINISTRACIÓN</p>
      </div>
    </div>
    <button class="text-gray-400 hover:bg-gray-100 p-2 rounded-full transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
        <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
      </svg>
    </button>
  </header>

  <!-- BEGIN: Modal Body (Scrollable) -->
  <div class="overflow-y-auto px-6 py-8 scrollbar-hide flex flex-col gap-10">
    <!-- BEGIN: Section Information -->
    <section class="space-y-4" data-purpose="form-section-info">
      <div class="flex items-center gap-3">
        <div class="w-1 h-5 bg-[#059669] rounded-full"></div>
        <h2 class="text-sm font-black text-gray-800 uppercase tracking-wider">Información Básica</h2>
      </div>
      <div class="space-y-6">
        <!-- Nombre del Estudio -->
        <div class="space-y-2">
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Nombre del Estudio</label>
          <input class="w-full bg-[#f8faff] border-none rounded-xl text-sm px-4 py-3.5 focus:ring-2 focus:ring-[#059669]/20 transition-all placeholder:text-gray-300" placeholder="Ej. Análisis de Ciclo de Vida Textil" type="text"/>
        </div>
        <!-- Objetivo / Descripción -->
        <div class="space-y-2">
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Objetivo / Descripción</label>
          <textarea class="w-full bg-[#f8faff] border-none rounded-xl text-sm px-4 py-3.5 focus:ring-2 focus:ring-[#059669]/20 transition-all resize-none placeholder:text-gray-300" placeholder="Define el propósito y alcance de este nuevo estudio..." rows="3"></textarea>
        </div>
        <!-- Grid Row: Año & Formato -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Año</label>
            <div class="relative">
              <select class="w-full bg-[#f8faff] border-none rounded-xl text-sm px-4 py-3.5 focus:ring-2 focus:ring-[#059669]/20 appearance-none cursor-pointer">
                <option>2024</option>
                <option>2023</option>
                <option>2022</option>
              </select>
              <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
              </div>
            </div>
          </div>
          <div class="space-y-2">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Formato</label>
            <div class="relative">
              <select class="w-full bg-[#f8faff] border-none rounded-xl text-sm px-4 py-3.5 focus:ring-2 focus:ring-[#059669]/20 appearance-none cursor-pointer">
                <option>Reporte Técnico (PDF)</option>
                <option>Planilla de Datos (XLSX)</option>
              </select>
              <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
              </div>
            </div>
          </div>
        </div>
        <!-- Grid Row: Estado & Acceso -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Estado</label>
            <div class="flex p-1 bg-[#f0f4ff] rounded-xl">
              <button class="flex-1 py-3 text-xs font-black uppercase tracking-widest text-[#059669] bg-white rounded-lg shadow-sm">Vigente</button>
              <button class="flex-1 py-3 text-xs font-black uppercase tracking-widest text-gray-400">Borrador</button>
              <button class="flex-1 py-3 text-xs font-black uppercase tracking-widest text-gray-400">Derogada</button>
            </div>
          </div>
          <div class="space-y-2">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Tipo de Acceso</label>
            <div class="flex items-center justify-between px-4 py-3 bg-[#f8faff] rounded-xl min-h-[54px]">
              <span class="text-[10px] font-bold uppercase text-gray-500">Solo Lectura</span>
              <!-- Toggle Switch -->
              <label class="relative inline-flex items-center cursor-pointer">
                <input checked="" class="sr-only peer" type="checkbox"/>
                <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#059669]"></div>
              </label>
              <span class="text-[10px] font-bold uppercase text-[#059669]">Descargable</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- BEGIN: Section Archive -->
    <section class="space-y-6 pt-2" data-purpose="form-section-archive">
      <div class="flex items-center gap-3">
        <div class="w-1 h-5 bg-[#059669] rounded-full"></div>
        <h2 class="text-sm font-black text-gray-800 uppercase tracking-wider">Archivo</h2>
      </div>
      <!-- Drag and Drop Area -->
      <div class="relative border-2 border-dashed border-[#dbe4ef] rounded-2xl min-h-[280px] sm:min-h-[320px] px-6 py-10 flex flex-col items-center justify-center bg-white hover:bg-[#f8fbff] hover:border-[#059669]/40 transition-all cursor-pointer group">
        <div class="flex flex-col items-center justify-center text-center max-w-xl mx-auto">
          <div class="w-20 h-20 bg-[#edf7f2] rounded-3xl flex items-center justify-center text-[#10b981] mb-6 group-hover:scale-110 transition-transform">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewbox="0 0 24 24">
              <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
            </svg>
          </div>
          <h3 class="text-2xl font-extrabold text-[#0f172a] leading-tight">Haz clic para subir o arrastra un archivo</h3>
          <p class="mt-3 text-lg text-[#94a3b8]">Soportamos formatos PDF y PPTX con un límite de 20MB</p>
        </div>
        <input class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" type="file"/>
      </div>
    </section>

  </div>

  <!-- BEGIN: Modal Footer -->
  <footer class="px-6 py-5 border-t border-gray-100 bg-white flex flex-col sm:flex-row items-center justify-between gap-4 sticky bottom-0 z-30">
    <button class="w-full sm:w-auto px-8 py-3 text-[11px] font-black text-gray-400 uppercase tracking-widest hover:text-gray-600 transition-colors">
      Cancelar
    </button>
    <div class="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto">
      <span class="hidden sm:block text-[9px] font-bold text-gray-400 uppercase tracking-widest text-right leading-tight">Todos los campos<br/>son obligatorios</span>
      <button class="w-full sm:w-auto px-10 py-4 bg-[#059669] text-white text-[11px] font-black uppercase tracking-[0.15em] rounded-xl shadow-lg shadow-[#059669]/20 hover:bg-[#047857] active:scale-95 transition-all flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
          <path d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
        Guardar Estudio
      </button>
    </div>
  </footer>
  <!-- END: Modal Footer -->
</main>
<!-- Notification Toast -->
<div class="fixed bottom-6 right-6 z-50 pointer-events-none sm:pointer-events-auto" data-purpose="toast-notification">
  <div class="bg-[#064e3b] text-white px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-4 border border-white/10">
    <!-- Check Icon -->
    <div class="w-8 h-8 rounded-full bg-[#10b981] flex items-center justify-center shadow-inner">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
        <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
      </svg>
    </div>
    <div>
      <p class="text-xs font-black">Cambios guardados</p>
      <p class="text-[9px] font-bold text-emerald-400 uppercase tracking-widest">Sistema Administrativo</p>
    </div>
    <button class="ml-4 p-1 hover:bg-white/10 rounded-full transition-colors pointer-events-auto">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
        <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
      </svg>
    </button>
  </div>
</div>
      </div>
    </div>
  </div>

</body></html>
