<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Registros de Inicio de Sesión - Reciclame</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#10b981",
                        "primary-dark": "#0f172a",
                        "table-panel": "#dfe6f5",
                        "surface-soft": "#f8fafc",
                        "surface-card": "#ffffff",
                        "text-main": "#0f172a",
                        "text-soft": "#64748b",
                        "text-muted": "#94a3b8",
                        "danger": "#e11d48",
                        "warning": "#f59e0b",
                        "success": "#10b981",
                        sidebar: {
                            active: "#059669",
                            activeBg: "#F0FDF4",
                        },
                    },
                    boxShadow: {
                        soft: "0 8px 24px rgba(15, 23, 42, 0.05)",
                        card: "0px 10px 30px rgba(0, 0, 0, 0.04)",
                    }
                }
            }
        };
    </script>
    <style>
        body { font-family: Inter, system-ui, sans-serif; }
    </style>
</head>

<body class="bg-surface text-on-surface font-body h-screen flex overflow-hidden selection:bg-secondary-container selection:text-on-secondary-container">
<div class="flex h-screen w-full">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="flex-1 flex flex-col min-w-0 bg-surface relative">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="flex-1 overflow-y-auto px-8 py-3">
            <section>
                <h1 class="mb-1 text-3xl font-extrabold tracking-tight text-primary-dark">Registros de Inicio de Sesión</h1>
                <p class="text-sm font-medium text-slate-500">
                    Monitoreo histórico de accesos y persistencia de sesión dentro del ecosistema Recíclame.
                </p>
            </section>

            <form method="get" th:action="@{/admin/registros/actividad}"
                  class="grid grid-cols-1 gap-3 rounded-[1.7rem] border border-slate-100 bg-white p-4 shadow-sm xl:grid-cols-[1.5fr_0.8fr_0.8fr_auto_auto] xl:items-end">
                <div>
                    <label class="mb-2 block text-[10px] font-bold uppercase tracking-widest text-slate-400">Buscar usuario</label>
                    <input type="text"
                           name="texto"
                           th:value="${texto}"
                           placeholder="Nombre o correo..."
                           class="h-11 w-full rounded-xl border border-slate-100 bg-white px-4 text-sm outline-none focus:ring-2 focus:ring-primary" />
                </div>

                <div>
                    <label class="mb-2 block text-[10px] font-bold uppercase tracking-widest text-slate-400">Fecha</label>
                    <input type="date"
                           name="fecha"
                           th:value="${fecha}"
                           class="h-11 w-full rounded-xl border border-slate-100 bg-white px-4 text-sm outline-none focus:ring-2 focus:ring-primary" />
                </div>

                <div>
                    <label class="mb-2 block text-[10px] font-bold uppercase tracking-widest text-slate-400">Rol</label>
                    <select name="rol"
                            class="h-11 w-full rounded-xl border border-slate-100 bg-white px-4 text-sm outline-none focus:ring-2 focus:ring-primary">
                        <option value="">Todos los roles</option>
                        <option value="SOCIO" th:selected="${rol == 'SOCIO'}">SOCIO</option>
                        <option value="VISUALIZADOR" th:selected="${rol == 'VISUALIZADOR'}">VISUALIZADOR</option>
                        <option value="ADMIN" th:selected="${rol == 'ADMIN'}">ADMIN</option>
                    </select>
                </div>

                <div class="flex gap-2">
                    <button class="rounded-full bg-white px-4 py-2.5 text-sm font-bold text-slate-600 shadow-sm">
                        Filtrar
                    </button>
                </div>

                <div class="flex gap-2">
                    <a th:href="@{/admin/registros/actividad/exportar(texto=${texto},fecha=${fecha},rol=${rol})}"
                       class="rounded-full bg-white px-4 py-2.5 text-sm font-bold text-slate-600 shadow-sm">
                        Exportar
                    </a>
                </div>
            </form>

            <section class="rounded-[1.7rem] border border-slate-100 bg-table-panel p-4">
                <div class="overflow-hidden rounded-[1.3rem] border border-slate-100 bg-white shadow-sm">
                    <table class="w-full border-collapse text-left">
                        <thead>
                        <tr class="bg-slate-50/50">
                            <th class="px-5 py-3 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Usuario</th>
                            <th class="px-5 py-3 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Rol</th>
                            <th class="px-5 py-3 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Fecha</th>
                            <th class="px-5 py-3 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Hora entrada</th>
                            <th class="px-5 py-3 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Duración</th>
                            <th class="px-5 py-3 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Estado</th>
                        </tr>
                        </thead>

                        <tbody class="divide-y divide-slate-50">
                        <tr th:each="r : ${sesiones}" class="hover:bg-slate-50/50">
                            <td class="px-5 py-3">
                                <div class="flex items-center gap-3">
                                    <div class="flex h-9 w-9 items-center justify-center rounded-full bg-primary/10 text-sm font-bold text-primary"
                                         th:text="${r.usuarioIniciales}"></div>
                                    <div>
                                        <p class="text-sm font-bold leading-tight text-slate-900" th:text="${r.usuarioNombreCompleto}"></p>
                                        <p class="text-[11px] leading-tight text-slate-400" th:text="${r.usuario.correo}"></p>
                                    </div>
                                </div>
                            </td>

                            <td class="px-5 py-3">
                                <span class="rounded-full bg-primary/10 px-3 py-1 text-[10px] font-extrabold uppercase text-primary"
                                      th:text="${r.usuario.rol.nombre}">
                                </span>
                            </td>

                            <td class="px-5 py-3 text-sm font-medium text-slate-600" th:text="${r.fechaTexto}"></td>
                            <td class="px-5 py-3 text-sm font-medium text-slate-600" th:text="${r.horaEntradaTexto}"></td>
                            <td class="px-5 py-3 text-sm font-medium text-slate-600" th:text="${r.duracionTexto}"></td>

                            <td class="px-5 py-3">
                                <div class="flex items-center gap-2" th:if="${r.estado == 'VIGENTE'}">
                                    <div class="h-2 w-2 rounded-full bg-primary"></div>
                                    <span class="text-sm font-bold text-primary">Vigente</span>
                                </div>

                                <div class="flex items-center gap-2" th:if="${r.estado == 'FINALIZADA'}">
                                    <div class="h-2 w-2 rounded-full bg-slate-400"></div>
                                    <span class="text-sm font-bold text-slate-500">Finalizada</span>
                                </div>

                                <div class="flex items-center gap-2" th:if="${r.estado == 'EXPIRADA'}">
                                    <div class="h-2 w-2 rounded-full bg-rose-500"></div>
                                    <span class="text-sm font-bold text-rose-600">Sesión expirada</span>
                                </div>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(sesiones)}">
                            <td colspan="6" class="px-6 py-8 text-center text-sm text-slate-400">
                                No se encontraron registros de actividad
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-4 flex items-center justify-between">
                    <p class="text-sm text-slate-500">
                        Página <span th:text="${currentPage + 1}"></span> de <span th:text="${totalPages}"></span>
                    </p>

                    <div class="flex gap-2">
                        <a th:if="${hasPrevious}"
                           th:href="@{/admin/registros/actividad(page=${currentPage - 1},texto=${texto},fecha=${fecha},rol=${rol})}"
                           class="rounded-full bg-white px-4 py-2 text-sm font-bold text-slate-600 shadow-sm">
                            Anterior
                        </a>

                        <a th:if="${hasNext}"
                           th:href="@{/admin/registros/actividad(page=${currentPage + 1},texto=${texto},fecha=${fecha},rol=${rol})}"
                           class="rounded-full bg-white px-4 py-2 text-sm font-bold text-slate-600 shadow-sm">
                            Siguiente
                        </a>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
