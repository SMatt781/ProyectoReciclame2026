<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Centro de Notificaciones | Reciclame</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"/>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-error-container": "#93000a",
                        "surface-bright": "#f7f9fb",
                        "surface-dim": "#d8dadc",
                        "tertiary-fixed": "#cfe9d9",
                        "tertiary-container": "#092016",
                        "primary-container": "#021d30",
                        "on-secondary-container": "#00743a",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#b1c9e2",
                        "on-surface-variant": "#43474c",
                        "on-primary": "#ffffff",
                        "background": "#f7f9fb",
                        "surface-container-high": "#e6e8ea",
                        "outline-variant": "#c3c7cd",
                        "on-secondary-fixed": "#00210c",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#006d37",
                        "surface-variant": "#e0e3e5",
                        "on-background": "#191c1e",
                        "inverse-surface": "#2d3133",
                        "on-tertiary-fixed-variant": "#354c40",
                        "on-secondary": "#ffffff",
                        "outline": "#73777d",
                        "surface-container-highest": "#e0e3e5",
                        "on-tertiary-container": "#71897c",
                        "tertiary-fixed-dim": "#b3ccbd",
                        "on-error": "#ffffff",
                        "tertiary": "#000000",
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#eceef0",
                        "error": "#ba1a1a",
                        "surface-tint": "#496177",
                        "on-secondary-fixed-variant": "#005228",
                        "on-primary-container": "#6f869e",
                        "secondary-container": "#6bfe9c",
                        "on-tertiary-fixed": "#092016",
                        "secondary-fixed": "#6bfe9c",
                        "surface": "#f7f9fb",
                        "inverse-on-surface": "#eff1f3",
                        "on-surface": "#191c1e",
                        "primary": "#000000",
                        "on-primary-fixed": "#021d30",
                        "on-primary-fixed-variant": "#31495e",
                        "primary-fixed": "#cde5ff",
                        "secondary-fixed-dim": "#4ae183",
                        "primary-fixed-dim": "#b1c9e2"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    fontFamily: {
                        headline: ["Plus Jakarta Sans", "system-ui", "sans-serif"],
                        body: ["Inter", "system-ui", "sans-serif"],
                        label: ["Inter", "system-ui", "sans-serif"]
                    }
                }
            }
        };
    </script>

    <style>
        .ambient-shadow {
            box-shadow: 0 4px 24px -4px rgba(0, 27, 46, 0.06);
        }

        .ghost-border {
            box-shadow: inset 0 0 0 1px rgba(195, 199, 205, 0.15);
        }

        .icon-sm { width: 1.25rem; height: 1.25rem; }
        .icon-md { width: 1.5rem; height: 1.5rem; }
        .icon-lg { width: 2rem; height: 2rem; }
        .icon-xl { width: 2.5rem; height: 2.5rem; }
    </style>
</head>

<body class="bg-surface text-on-surface font-body h-screen flex overflow-hidden selection:bg-secondary-container selection:text-on-secondary-container">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- Main -->
<div class="flex-1 flex flex-col min-w-0 bg-surface relative">
    <!-- Topbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Content -->
    <main class="flex-1 overflow-y-auto px-8 py-3">
        <div class="w-full max-w-5xl mx-auto">

            <!-- Header -->
            <div class="mb-5">
                <div>
                    <h2 class="font-headline font-extrabold text-[2rem] text-on-primary-fixed leading-tight tracking-tight">
                        Centro de Notificaciones
                    </h2>
                    <p class="font-body text-on-surface-variant text-base mt-2 max-w-2xl leading-relaxed">
                        Mantente al día con publicaciones, solicitudes de usuarios y alertas importantes del sistema.
                    </p>
                </div>
            </div>

            <!-- Main block -->
            <div class="bg-transparent border border-outline-variant/30 rounded-xl p-6 mb-6">

                <!-- Tabs -->
                <div class="flex flex-wrap gap-6 mb-8 border-b border-surface-variant" id="notificationTabs">
                    <button data-filter="ALL" class="pb-3 text-secondary font-bold text-sm border-b-2 border-secondary">
                        Todas las actividades
                    </button>
                    <button data-filter="ESTUDIO" class="pb-3 text-on-surface-variant font-semibold text-sm hover:text-on-primary-fixed transition-colors">
                        Estudios
                    </button>
                    <button data-filter="NORMATIVA" class="pb-3 text-on-surface-variant font-semibold text-sm hover:text-on-primary-fixed transition-colors">
                        Normativas
                    </button>
                    <button data-filter="SOLICITUD"
                            th:if="${usuarioRol == 'ADMIN' || usuarioRol == 'SUPERADMIN'}"
                            class="pb-3 text-on-surface-variant font-semibold text-sm hover:text-on-primary-fixed transition-colors">
                        Solicitudes
                    </button>
                </div>

                <!-- Cards -->
                <div class="space-y-5">
                    <div id="emptyNotificationsGlobal"
                         th:if="${notificaciones == null or #lists.isEmpty(notificaciones)}"
                         class="bg-surface-container-lowest rounded-[1.5rem] p-6 ambient-shadow ghost-border text-on-surface-variant">
                        No hay notificaciones nuevas por ahora.
                    </div>

                    <div id="emptyNotificationsFilter"
                         class="hidden bg-surface-container-lowest rounded-[1.5rem] p-6 ambient-shadow ghost-border text-on-surface-variant">
                        No hay notificaciones nuevas por ahora.
                    </div>

                    <div th:each="n : ${notificaciones}"
                         th:attr="data-tipo=${n.tipo}"
                         class="bg-surface-container-lowest rounded-[1.5rem] p-6 ambient-shadow ghost-border flex items-start gap-4 relative group hover:-translate-y-1 transition-transform duration-300">
                        <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0"
                             th:classappend="${n.tipo == 'SOLICITUD' ? ' bg-surface-container text-on-surface-variant' : (n.tipo == 'BIENVENIDA' ? ' bg-secondary-container/30 text-secondary' : ' bg-blue-100 text-primary-container')}">
                            <div th:switch="${n.tipo}">
                                <svg th:case="'SOLICITUD'" class="icon-md text-current" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M15 12c2.21 0 4-1.79 4-4S17.21 4 15 4s-4 1.79-4 4 1.79 4 4 4zm-6 0c2.21 0 4-1.79 4-4S11.21 4 9 4 5 5.79 5 8s1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4zm6 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.98 1.97 3.45v2h8v-2c0-2.66-5.33-4-8-4z"/>
                                </svg>
                                <svg th:case="'BIENVENIDA'" class="icon-md text-current" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 3l2.09 4.24L19 8l-3.45 3.36L16.18 16 12 13.77 7.82 16l.63-4.64L5 8l4.91-.76L12 3z"/>
                                </svg>
                                <svg th:case="*" class="icon-md text-current" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/>
                                </svg>
                            </div>
                        </div>

                        <div class="flex-1 pr-8">
                            <div class="flex justify-between items-center mb-1 gap-4">
                                <span class="text-secondary font-bold text-[11px] uppercase tracking-wider"
                                      th:text="${n.etiqueta}">Documento publicado</span>
                                <div class="flex items-center gap-3">
                                    <span class="text-on-surface-variant text-xs" th:text="${n.tiempo}">Hace un momento</span>
                                </div>
                            </div>

                            <h3 class="text-lg font-bold text-on-primary-fixed mb-2" th:text="${n.titulo}">Titulo</h3>
                            <p class="text-on-surface-variant text-sm leading-relaxed" th:text="${n.mensaje}">
                                Mensaje de notificacion.
                            </p>

                            <a th:if="${n.enlace != null}" th:href="${n.enlace}"
                               class="inline-flex items-center gap-2 mt-4 px-4 py-2 bg-surface-container text-primary-container font-semibold rounded-lg text-sm hover:bg-surface-container-high transition-colors">
                                Ver detalle
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    (function () {
        var tabs = document.querySelectorAll("#notificationTabs button[data-filter]");
        var cards = document.querySelectorAll("[data-tipo]");
        var emptyGlobal = document.getElementById("emptyNotificationsGlobal");
        var emptyFilter = document.getElementById("emptyNotificationsFilter");

        function setActive(tab) {
            tabs.forEach(function (btn) {
                btn.classList.remove("text-secondary", "font-bold", "border-b-2", "border-secondary");
                btn.classList.add("text-on-surface-variant", "font-semibold");
            });
            tab.classList.add("text-secondary", "font-bold", "border-b-2", "border-secondary");
            tab.classList.remove("text-on-surface-variant", "font-semibold");
        }

        function applyFilter(filter) {
            var visibleCount = 0;
            cards.forEach(function (card) {
                var tipo = card.getAttribute("data-tipo") || "";
                if (filter === "ALL") {
                    card.classList.remove("hidden");
                    visibleCount += 1;
                    return;
                }
                if (tipo.toUpperCase().indexOf(filter) === 0) {
                    card.classList.remove("hidden");
                    visibleCount += 1;
                } else {
                    card.classList.add("hidden");
                }
            });

            if (emptyFilter) {
                if (visibleCount === 0 && (!emptyGlobal || emptyGlobal.classList.contains("hidden"))) {
                    emptyFilter.classList.remove("hidden");
                } else {
                    emptyFilter.classList.add("hidden");
                }
            }
        }

        tabs.forEach(function (tab) {
            tab.addEventListener("click", function () {
                var filter = tab.getAttribute("data-filter") || "ALL";
                setActive(tab);
                applyFilter(filter);
            });
        });

        if (tabs.length > 0) {
            applyFilter("ALL");
        }
    })();
</script>

</body>
</html>
