<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>

                    "secondary-container": "#c3ecd7",
                    "surface-container-highest": "#d3e4fe",
                    "error": "#ba1a1a",
                    "primary": "#000000",
                    "outline": "#76777d",
                    "on-tertiary-fixed": "#001a42",
                    "on-tertiary": "#ffffff",

                    "on-error": "#ffffff",

            "spacing": {
                    "sidebar-width": "260px",
                    "container-padding": "40px",
                    "stack-sm": "8px",
                    "gutter-md": "24px",
                    "stack-lg": "32px",
                    "stack-md": "16px"
            },
            "fontFamily": {
                    "title-lg": ["Plus Jakarta Sans"],
                    "body-sm": ["Plus Jakarta Sans"],

                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="text-on-surface min-h-screen bg-[#818ea1] flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="relative w-full max-w-lg bg-white rounded-xxl shadow-xl overflow-hidden border border-slate-100">
<!-- Modal Header -->
<div class="px-8 pt-8 pb-6 flex justify-between items-start">
<div>
<h2 class="text-2xl font-black text-slate-900 tracking-tight">Gestionar Seguridad de Cuenta</h2>
<p class="text-sm font-semibold text-error mt-1 tracking-widest uppercase">Acción Requerida</p>
</div>
<button class="p-2 rounded-full hover:bg-slate-100 transition-colors text-slate-400">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="px-8 pb-8">
<p class="text-sm text-slate-500 mb-8">
                ¿Deseas restringir el acceso para <span class="font-bold text-slate-900">Nombre del Admin</span>? Esta acción será auditada y quedará registrada en el historial de seguridad.
            </p>
<!-- Options Selection -->
<div class="space-y-4">
<!-- Option 1 -->
<label class="relative flex items-center gap-4 p-4 border border-outline-variant rounded-xl cursor-pointer hover:border-emerald-500 transition-all group">
<input checked="" class="w-5 h-5 rounded-full border-outline-variant text-emerald-500 focus:ring-emerald-500/20" name="security_action" type="radio"/>
<div class="flex-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-slate-600 text-lg">lock</span>
<span class="font-bold text-slate-900">Bloquear Acceso Temporalmente</span>
</div>
<p class="text-xs text-slate-500 mt-0.5">Inhabilita el inicio de sesión hasta revisión manual.</p>
</div>
</label>
<!-- Option 2 -->
<label class="relative flex items-center gap-4 p-4 border border-outline-variant rounded-xl cursor-pointer hover:border-emerald-500 transition-all group">
<input class="w-5 h-5 rounded-full border-outline-variant text-emerald-500 focus:ring-emerald-500/20" name="security_action" type="radio"/>
<div class="flex-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-slate-600 text-lg">key</span>
<span class="font-bold text-slate-900">Restablecer Contraseña</span>
</div>
<p class="text-xs text-slate-500 mt-0.5">Fuerza el cambio de credenciales en el próximo acceso.</p>
</div>
</label>
</div>
</div>
<!-- Modal Footer -->
<div class="px-8 py-6 bg-slate-50 flex flex-col items-center gap-6 border-t border-slate-100">
<div class="flex items-center justify-end gap-4 w-full">
<button class="px-6 py-3 font-semibold text-slate-500 hover:text-slate-900 transition-colors" type="button">
                    Cancelar
                </button>
<button class="bg-error hover:opacity-90 text-white px-8 py-3 rounded-xl font-bold transition-all active:scale-95 shadow-lg shadow-error/20" type="submit">
                    Bloquear Cuenta
                </button>
</div>
<!-- Security Protocol Branding -->
<div class="flex items-center gap-2 opacity-40">
<span class="material-symbols-outlined text-[14px]">shield</span>
<span class="text-[10px] font-bold tracking-[0.15em] uppercase">Protocolo de Seguridad Circular</span>
</div>
</div>
</div>
</body></html>
