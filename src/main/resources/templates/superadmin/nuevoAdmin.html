        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;

<body class="bg-surface-dim min-h-screen flex items-center justify-center p-4">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-on-surface/40 backdrop-blur-sm z-40"></div>
<!-- Modal Container -->
<div class="relative z-50 w-full max-w-lg bg-surface-container-lowest rounded-xxl shadow-xl overflow-hidden border border-slate-100">
<!-- Header -->
<div class="px-8 pt-8 pb-6 flex justify-between items-start">
<div>
<h1 class="text-2xl font-black text-slate-900 tracking-tight">Crear Nuevo Administrador</h1>
<p class="text-sm text-slate-500 mt-1">Completa los datos para asignar un nuevo perfil de gestión.</p>
</div>
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Form Content -->
<form class="px-8 pb-8 space-y-6">
<!-- Campo: Nombres y Apellidos -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">NOMBRES Y APELLIDOS*</label>
<div class="relative">
<input class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 font-body-md text-body-md text-on-surface placeholder:text-outline transition-all focus:ring-emerald-500/20 focus:border-emerald-500" placeholder="Ej. Juan Pérez" type="text"/>
</div>
</div>
<!-- Campo: Correo Electrónico -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">CORREO ELECTRÓNICO*</label>
<div class="relative">
<input class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 font-body-md text-body-md text-on-surface placeholder:text-outline transition-all focus:ring-emerald-500/20 focus:border-emerald-500" placeholder="usuario@reciclame.org" type="email"/>
</div>
</div>
<!-- Fila: Rol y Contraseña -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">ROL</label>
<div class="relative">
<select class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 font-body-md text-body-md text-on-surface transition-all focus:ring-emerald-500/20 focus:border-emerald-500">
<option selected="">Administrador</option>
<option>Editor</option>
<option>Visualizador</option>
</select>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">CONTRASEÑA TEMPORAL*</label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-4 pr-12 bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 font-body-md text-body-md text-on-surface transition-all focus:ring-emerald-500/20 focus:border-emerald-500" type="password" value="••••••••"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 p-2 flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Checkbox: Invitación -->
<div class="flex items-center gap-3 pt-2">
<div class="relative flex items-center">
<input checked="" class="w-5 h-5 rounded border-outline-variant cursor-pointer focus:ring-emerald-500/20 focus:border-emerald-500 text-emerald-500 focus:ring-emerald-500" id="invite" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface cursor-pointer select-none" for="invite">
                    Enviar invitación por correo electrónico automáticamente
                </label>
</div>
</form>
<!-- Footer -->
<div class="px-8 py-6 bg-slate-50 flex items-center justify-end gap-4 border-t border-slate-100">
<button class="px-6 py-3 font-semibold text-slate-500 hover:text-slate-900 transition-colors" type="button">
                Cancelar
            </button>
<button class="bg-emerald-500 hover:bg-emerald-400 text-slate-900 px-8 py-3 rounded-xl font-bold transition-all active:scale-95 shadow-lg shadow-emerald-500/20" type="submit">Crear Administrador</button>
</div>
</div>
