<body class="h-full flex items-center justify-center p-6">
<!-- Edit Admin Modal -->
<div class="relative z-10 w-full max-w-xl bg-surface-container-lowest rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.25)] overflow-hidden border border-outline-variant">
<!-- Header -->
<div class="px-gutter-md pt-stack-lg pb-stack-md">
<h2 class="font-headline-md text-headline-md text-on-surface font-extrabold">Editar Administrador</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Actualice la información de acceso y privilegios del usuario.</p>
</div>
<form class="px-gutter-md pb-stack-lg">
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter-md">
<!-- Nombres y Apellidos -->
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase">Nombres y Apellidos</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md focus:ring-2 focus:ring-on-tertiary-container focus:border-transparent outline-none transition-all" type="text" value="Mateo Villanueva"/>
</div>
<!-- Correo Electrónico -->
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase">Correo Electrónico</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md focus:ring-2 focus:ring-on-tertiary-container focus:border-transparent outline-none transition-all" type="email" value="m.villanueva@circular.ed"/>
</div>
<!-- Rol Selector -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase">Rol</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md focus:ring-2 focus:ring-on-tertiary-container outline-none transition-all pr-10">
<option selected="" value="Admin">Admin</option>
<option value="Editor">Editor</option>
<option value="Viewer">Viewer</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
<!-- Estado Selector -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase">Estado</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md focus:ring-2 focus:ring-on-tertiary-container outline-none transition-all pr-10">
<option selected="" value="Vigente">Vigente</option>
<option value="Suspendido">Suspendido</option>
<option value="Inactivo">Inactivo</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="mt-stack-lg pt-stack-lg border-t border-outline-variant flex flex-col md:flex-row items-center justify-between gap-4">
<!-- Security Badge -->
<div class="flex items-center gap-2 px-3 py-1.5 bg-surface-container-high rounded-full">
<span class="material-symbols-outlined text-[18px] text-on-tertiary-container" data-weight="fill" style="font-variation-settings: 'FILL' 1;">shield_person</span>
<span class="font-label-md text-label-md text-on-tertiary-container">SESIÓN PROTEGIDA</span>
</div>
<!-- Buttons -->
<div class="flex items-center gap-stack-md w-full md:w-auto">
<button class="flex-1 md:flex-none font-title-lg text-body-md text-on-surface-variant hover:text-on-surface transition-colors px-4 py-2" type="button">
                        Cancelar
                    </button>
<button class="flex-1 md:flex-none flex items-center justify-center gap-2 bg-secondary text-on-secondary px-6 py-3 rounded-lg font-title-lg text-body-md hover:opacity-90 active:scale-95 transition-all shadow-md" type="submit">
<span class="material-symbols-outlined text-[20px]">save</span>
                        Guardar Cambios
                    </button>
</div>
</div>
</form>
</div>
<!-- Decorative Corner Element -->
<div class="fixed bottom-0 right-0 p-8 opacity-60">
<div class="flex flex-col items-end">
<span class="font-display-xl text-surface-container-lowest select-none">ADMIN</span>
<div class="h-1 w-24 bg-surface-container-lowest rounded-full mt-2"></div>
</div>
</div>
</body></html>
