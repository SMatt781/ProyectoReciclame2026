<!DOCTYPE html>
<html lang="es" class="h-full" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil - Recíclame</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-surface text-on-surface font-sans h-full overflow-hidden">
    <div class="flex h-full w-full">
        <!-- Sidebar dinámico según rol -->
        <div th:replace="${sessionUser.rol == 'SUPERADMIN'} ? ~{fragments/sidebar_superadmin :: sidebar} : ~{fragments/sidebar :: sidebar}"></div>

        <div class="flex-1 flex flex-col min-w-0 bg-surface relative">
            <!-- Navbar -->
            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <!-- Main Content -->
            <main class="flex-1 overflow-y-auto px-8 py-8">
                <!-- Header -->
                <div class="mb-8">
                    <h1 class="text-[32px] font-bold text-[#001B2E] tracking-tight">Mi Perfil</h1>
                    <p class="text-on-surface-variant">Gestiona tu información personal y los datos de tu cuenta.</p>
                </div>

                <!-- Mensajes de éxito/error -->
                <div th:if="${mensaje}" class="mb-6 p-4 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-2xl flex items-center gap-3">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                    </svg>
                    <span th:text="${mensaje}"></span>
                </div>

                <div th:if="${error}" class="mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-2xl flex items-center gap-3">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                    </svg>
                    <span th:text="${error}"></span>
                </div>

                <!-- Información de Usuario -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Card: Información Personal -->
                    <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
                        <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                            <svg class="w-6 h-6 text-emerald-600" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                            </svg>
                            Información Personal
                        </h2>

                        <div class="space-y-4">
                            <div>
                                <!-- Nombre Completo para DNI, Razón Social para RUC -->
                                <label class="text-sm font-medium text-gray-600"
                                       th:text="${usuario.identificacion.tipo == 'DNI'} ? 'Nombre Completo' : 'Razón Social'">
                                </label>
                                <p class="text-lg font-semibold text-gray-900"
                                   th:if="${usuario.apellidoPaterno != null}"
                                   th:text="|${usuario.nombres} ${usuario.apellidoPaterno}|">
                                </p>
                                <p class="text-lg font-semibold text-gray-900"
                                   th:if="${usuario.apellidoPaterno == null}"
                                   th:text="${usuario.nombres}">
                                </p>
                            </div>

                            <div>
                                <label class="text-sm font-medium text-gray-600">Correo Electrónico</label>
                                <p class="text-lg font-semibold text-gray-900" th:text="${usuario.correo}">a20222079@pucp.edu.pe</p>
                            </div>

                            <!-- Apellidos solo para DNI -->
                            <div th:if="${usuario.apellidoPaterno != null}">
                                <label class="text-sm font-medium text-gray-600">Apellidos</label>
                                <p class="text-lg font-semibold text-gray-900"
                                   th:text="|${usuario.apellidoPaterno} ${usuario.apellidoMaterno != null ? usuario.apellidoMaterno : ''}|">
                                </p>
                            </div>

                            <div>
                                <label class="text-sm font-medium text-gray-600">Rol</label>
                                <div class="mt-1 flex items-center gap-2">
                                    <span class="text-xs font-bold px-3 py-1 rounded-full"
                                          th:classappend="${usuario.rol.nombre == 'SUPERADMIN'} ? 'bg-purple-100 text-purple-700' :
                                                          (${usuario.rol.nombre == 'ADMIN'} ? 'bg-emerald-100 text-emerald-700' :
                                                          (${usuario.rol.nombre == 'SOCIO'} ? 'bg-blue-100 text-blue-700' :
                                                          'bg-slate-100 text-slate-600'))"
                                          th:text="${usuario.rol.nombre}">
                                        ADMIN
                                    </span>
                                </div>
                            </div>

                            <div>
                                <label class="text-sm font-medium text-gray-600">Teléfono</label>
                                <p class="text-lg font-semibold text-gray-900" th:text="${usuario.telefono != null ? usuario.telefono : 'No registrado'}">No registrado</p>
                            </div>

                            <div>
                                <label class="text-sm font-medium text-gray-600">Fecha de Registro</label>
                                <p class="text-sm text-gray-500" th:text="${#temporals.format(usuario.fechaRegistro, 'dd/MM/yyyy HH:mm')}">25/05/2026</p>
                            </div>
                        </div>
                    </div>

                    <!-- Card: Foto de Perfil -->
                    <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
                        <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                            <svg class="w-6 h-6 text-emerald-600" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" />
                            </svg>
                            Foto de Perfil
                        </h2>

                        <!-- Vista Actual de Foto -->
                        <div class="mb-6">
                            <div class="w-32 h-32 mx-auto mb-4 rounded-full overflow-hidden border-4 border-emerald-100 bg-gradient-to-br from-emerald-50 to-emerald-100 flex items-center justify-center">
                                <img id="foto-actual" th:if="${usuario.urlAvatar}" th:src="${usuario.urlAvatar}" alt="Foto de perfil" class="w-full h-full object-cover" />
                                <div th:unless="${usuario.urlAvatar}" class="text-center">
                                    <div class="w-16 h-16 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center mx-auto">
                                        <span class="text-2xl font-bold text-white" th:text="${usuario.iniciales}">MS</span>
                                    </div>
                                </div>
                            </div>

                            <p class="text-center text-sm text-gray-500 mb-4" th:unless="${usuario.urlAvatar}">
                                No tienes foto de perfil
                            </p>
                        </div>

                        <!-- Formulario de Upload -->
                        <form th:action="@{/perfil/actualizar-foto}" method="post" enctype="multipart/form-data" id="form-foto">
                            <!-- Drag & Drop Area -->
                            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer hover:border-emerald-400 hover:bg-emerald-50 transition-colors mb-4" id="drop-zone">
                                <svg class="w-8 h-8 mx-auto text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                                </svg>
                                <p class="text-sm text-gray-600">Arrastra una imagen aqui o</p>
                                <label class="text-sm font-semibold text-emerald-600 cursor-pointer hover:text-emerald-700">
                                    selecciona un archivo
                                    <input type="file" name="foto" accept="image/*" class="hidden" id="input-foto" />
                                </label>
                                <p class="text-xs text-gray-500 mt-2">JPG, PNG, GIF (max. 5MB)</p>
                            </div>

                            <!-- Vista Previa -->
                            <div id="preview-container" class="hidden mb-4">
                                <img id="preview-foto" src="" alt="Preview" class="w-full h-40 object-cover rounded-lg mb-2" />
                                <p id="preview-nombre" class="text-xs text-gray-500"></p>
                            </div>

                            <!-- Botones -->
                            <div class="flex gap-3">
                                <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">
                                    Guardar Foto
                                </button>
                                <button type="reset" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg transition-colors">
                                    Cancelar
                                </button>
                            </div>
                        </form>

                        <!-- Botón Eliminar Foto -->
                        <form th:if="${usuario.urlAvatar}" th:action="@{/perfil/eliminar-foto}" method="post" class="mt-4">
                            <button type="submit" class="w-full bg-red-50 hover:bg-red-100 text-red-700 font-semibold py-2 px-4 rounded-lg transition-colors"
                                    onclick="return confirm('¿Estás seguro de que deseas eliminar tu foto de perfil?')">
                                Eliminar Foto Actual
                            </button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- JavaScript para Foto -->
    <script th:src="@{/js/perfil.js}"></script>
</body>
</html>
