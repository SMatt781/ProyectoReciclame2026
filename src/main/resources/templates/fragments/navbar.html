<html xmlns:th="http://www.thymeleaf.org"><!-- NAVBAR MEJORADO CON HAMBURGUESA EN EL NAVBAR -->
<header th:fragment="navbar" class="flex justify-between items-center px-4 md:px-8 py-4 w-full h-20 docked top-0 sticky z-40 bg-[#f7f9fb]/80 dark:bg-slate-950/80 backdrop-blur-xl">

    <!-- Logo Area con Hamburguesa -->
    <div class="flex items-center gap-4 flex-shrink-0">
        <!-- Botón Hamburguesa (solo móvil) -->
        <button id="sidebar-toggle"
                onclick="const sb = document.querySelector('aside[th-fragment]') || document.querySelector('aside'); if(sb) { sb.classList.toggle('-translate-x-full'); document.getElementById('sidebar-overlay')?.classList.toggle('hidden'); document.getElementById('hamburger-icon')?.classList.toggle('hidden'); document.getElementById('close-icon')?.classList.toggle('hidden'); }"
                class="md:hidden p-2 hover:bg-surface-container-low dark:hover:bg-slate-800 rounded-lg transition-colors">
            <svg id="hamburger-icon" class="w-6 h-6 text-on-primary-fixed dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <svg id="close-icon" class="w-6 h-6 text-on-primary-fixed dark:text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <!-- Logo -->
        <img alt="Reciclame Logo" th:src="@{/images/logo-reciclame.png}" class="h-8 object-contain" />
    </div>

    <!-- Overlay oscuro (solo móvil) -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/40 md:hidden z-[190]"></div>

    <!-- Right Side / Actions & Profile -->
    <div class="flex items-center gap-6 ml-auto">

        <!-- Botón Ver Tutorial (solo SOCIO y VISUALIZADOR) -->
        <button th:if="${usuarioRol == 'SOCIO' or usuarioRol == 'VISUALIZADOR'}"
                th:data-user-id="${sessionUser != null ? sessionUser.idUsuario : 0}"
                th:data-user-rol="${usuarioRol}"
                th:data-home-url="${usuarioRol == 'SOCIO' ? '/socio' : '/visualizador'}"
                onclick="iniciarTourDesdeNavbar(this)"
                title="Ver tutorial de la plataforma"
                class="text-slate-500 dark:text-slate-400 hover:text-[#2ECC71] transition-colors relative inline-flex items-center justify-center group">
            <!-- Graduation cap icon -->
            <svg class="w-6 h-6 text-current" fill="currentColor" viewBox="0 0 24 24">
                <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
            </svg>
            <!-- Tooltip -->
            <span class="absolute top-full mt-2 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[10px] font-semibold px-2 py-1 rounded-md whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50">
                Ver tutorial
            </span>
        </button>

        <!-- Notifications -->
        <a id="notif-bell-link"
           th:href="${usuarioRol == 'SUPERADMIN' ? '/superadmin/notificaciones' : (usuarioRol == 'ADMIN' ? '/admin/notificaciones' : (usuarioRol == 'SOCIO' ? '/socio/notificaciones' : '/visualizador/notificaciones'))}"
           th:data-user-correo="${sessionUser != null ? sessionUser.correo : ''}"
           th:data-user-rol="${usuarioRol}"
           th:data-unread="${notificacionesNoLeidas != null ? notificacionesNoLeidas : 0}"
           class="text-slate-500 dark:text-slate-400 hover:text-[#2ECC71] transition-colors relative inline-flex items-center justify-center">
            <svg class="w-6 h-6 text-current" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V2c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 3.36 6 5.92 6 9v5l-2 2v1h16v-1l-2-2z"/>
            </svg>

            <span id="notif-badge"
                  th:if="${notificacionesNoLeidas != null and notificacionesNoLeidas > 0}"
                  th:text="${notificacionesNoLeidas}"
                  class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center border border-surface-container-lowest">
            </span>
            <span id="notif-badge-hidden"
                  th:if="${notificacionesNoLeidas == null or notificacionesNoLeidas == 0}"
                  style="display:none"
                  class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center border border-surface-container-lowest">
            </span>
        </a>

        <!-- Profile Card -->
        <div class="flex items-center gap-3 p-1 rounded-full hover:bg-surface-container-low transition-colors">
            <a th:href="@{/perfil}" class="flex items-center gap-3 p-1 rounded-full hover:bg-surface-container-low transition-colors">
                <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-sm ring-2 ring-surface-container-lowest shadow-sm overflow-hidden">
                    <img th:if="${sessionUser != null and sessionUser.urlAvatar != null}"
                         th:src="${sessionUser.urlAvatar}"
                         alt="Foto de perfil"
                         class="w-full h-full object-cover" />
                    <span th:unless="${sessionUser != null and sessionUser.urlAvatar != null}"
                          th:text="${sessionUser != null ? sessionUser.iniciales : 'US'}">US</span>
                </div>
            </a>

            <div class="hidden md:flex flex-col justify-center">
                <!-- Nombre: Completo para DNI, solo Razón Social para RUC -->
                <!-- DNI: tiene apellidoPaterno → mostrar nombre completo | RUC: sin apellidos → solo razón social -->
                <span class="font-['Inter'] font-medium text-sm text-[#001B2E] dark:text-white leading-tight"
                      th:text="${sessionUser != null ? (sessionUser.apellidoPaterno != null ? sessionUser.nombreCompleto : sessionUser.nombres) : 'Usuario'}">
                    Usuario
                </span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full w-max mt-0.5 tracking-wider uppercase"
                      th:classappend="${sessionUser.rol == 'SUPERADMIN'} ? 'bg-purple-100 text-purple-700' :
                      (${sessionUser.rol == 'ADMIN'} ? 'bg-emerald-100 text-emerald-700' :
                      (${sessionUser.rol == 'SOCIO'} ? 'bg-blue-100 text-blue-700' :
                      'bg-slate-100 text-slate-600'))"
                      th:text="${sessionUser != null ? sessionUser.rol : 'ROL'}">
                    ROL
                </span>
            </div>
        </div>

    </div>

    <!-- Tour guiado: debe estar DENTRO del fragment para cargarse en todas las páginas -->
    <script th:src="@{/js/tour.js}"></script>


</header>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const hamburgerIcon = document.getElementById('hamburger-icon');
        const closeIcon = document.getElementById('close-icon');

        if (sidebar) {
            sidebar.classList.toggle('-translate-x-full');
        }
        if (overlay) {
            overlay.classList.toggle('hidden');
        }
        if (hamburgerIcon) {
            hamburgerIcon.classList.toggle('hidden');
        }
        if (closeIcon) {
            closeIcon.classList.toggle('hidden');
        }
    }

    // Cerrar sidebar al hacer click en un enlace
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🔍 DOMContentLoaded ejecutado');

        // ─── Auto-desaparecer mensajes flash después de 5 segundos ───
        function autoDisappearMessage(selector) {
            const messages = document.querySelectorAll(selector);
            messages.forEach(function(message) {
                if (message) {
                    setTimeout(function() {
                        message.style.transition = 'opacity 0.5s ease-out';
                        message.style.opacity = '0';
                        setTimeout(function() {
                            message.remove();
                        }, 500);
                    }, 5000);
                }
            });
        }

        // Seleccionar todos los tipos de mensajes flash
        autoDisappearMessage('[class*="flash-message"]');
        autoDisappearMessage('.alert-success');
        autoDisappearMessage('.alert-error');
        autoDisappearMessage('.alert-info');

        // ─── Cerrar sidebar al hacer click en un enlace ───
        document.querySelectorAll('.sidebar-link').forEach(link => {
            link.addEventListener('click', () => {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                const hamburgerIcon = document.getElementById('hamburger-icon');
                const closeIcon = document.getElementById('close-icon');

                if (window.innerWidth <= 768) {
                    if (sidebar) sidebar.classList.add('-translate-x-full');
                    if (overlay) overlay.classList.add('hidden');
                    if (hamburgerIcon) hamburgerIcon.classList.remove('hidden');
                    if (closeIcon) closeIcon.classList.add('hidden');
                }
            });
        });

        // El spinner de botones se maneja desde /js/spinner.js (incluido globalmente)
    });
</script>

<!-- Spinner global: aplica a todos los formularios de páginas con navbar -->
<script th:src="@{/js/spinner.js}"></script>

<!-- WebSocket: SockJS + STOMP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
(function() {
    var bellLink = document.getElementById('notif-bell-link');
    if (!bellLink) return;

    var correo = bellLink.getAttribute('data-user-correo');
    if (!correo) return;

    // Badge management
    var unreadCount = parseInt(bellLink.getAttribute('data-unread') || '0', 10);

    console.log('[WS] Init - correo:', correo, '| rol:', bellLink.getAttribute('data-user-rol'), '| unread:', unreadCount);

    function getBadge() {
        return document.getElementById('notif-badge') || document.getElementById('notif-badge-hidden');
    }

    function updateBadge(count) {
        var badge = getBadge();
        if (!badge) return;
        badge.id = 'notif-badge';
        if (count > 0) {
            badge.textContent = count > 99 ? '99+' : count;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    }

    // Polling de respaldo: si el WebSocket falla, igual se actualiza la campanita
    setInterval(function() {
        fetch('/api/notificaciones/no-leidas', { credentials: 'same-origin' })
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(data) {
                if (data && typeof data.count === 'number' && data.count !== unreadCount) {
                    unreadCount = data.count;
                    updateBadge(unreadCount);
                }
            }).catch(function() {});
    }, 15000);

    // Toast notifications
    function showToast(titulo, mensaje, tipo) {
        var typeMap = {
            'ALERTA': 'warning',
            'EXITO': 'success',
            'SISTEMA': 'info',
            'INFO': 'info'
        };
        var cssType = typeMap[tipo] || 'info';

        // Remove existing toasts if more than 3
        var existing = document.querySelectorAll('.ws-toast');
        if (existing.length >= 3) {
            existing[0].remove();
        }

        var toast = document.createElement('div');
        toast.className = 'notification ws-toast ' + cssType;
        toast.style.cssText = 'position:fixed;top:80px;right:20px;z-index:99999;max-width:360px;min-width:260px;cursor:pointer;';
        toast.innerHTML =
            '<div style="display:flex;align-items:flex-start;gap:0.5rem;">' +
            '<div style="flex:1;">' +
            '<div style="font-weight:600;font-size:0.875rem;margin-bottom:2px;">' + (titulo || 'Notificación') + '</div>' +
            (mensaje ? '<div style="font-size:0.8rem;opacity:0.85;">' + mensaje + '</div>' : '') +
            '</div>' +
            '<button style="background:none;border:none;font-size:1.1rem;cursor:pointer;opacity:0.6;padding:0;line-height:1;" onclick="this.closest(\'.ws-toast\').remove()">×</button>' +
            '</div>';

        document.body.appendChild(toast);

        // Offset multiple toasts
        var toasts = document.querySelectorAll('.ws-toast');
        var offset = 80;
        toasts.forEach(function(t, i) {
            t.style.top = (offset + i * 90) + 'px';
        });

        setTimeout(function() {
            if (toast.parentNode) {
                toast.style.transition = 'opacity 0.4s';
                toast.style.opacity = '0';
                setTimeout(function() { toast.remove(); }, 400);
            }
        }, 5000);

        toast.addEventListener('click', function(e) {
            if (e.target.tagName !== 'BUTTON') {
                window.location.href = bellLink.getAttribute('href');
            }
        });
    }

    var rol = bellLink.getAttribute('data-user-rol') || '';

    // ── Sidebar badge de solicitudes pendientes ───────────────────────────
    function getSolicitudesBadge() {
        return document.getElementById('solicitudes-badge') || document.getElementById('solicitudes-badge-hidden');
    }
    function updateSolicitudesBadge(count) {
        var badge = getSolicitudesBadge();
        if (!badge) return;
        badge.id = 'solicitudes-badge';
        if (count > 0) {
            badge.textContent = count;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
        // También actualiza el banner del dashboard si existe
        var banner = document.getElementById('banner-solicitudes');
        if (banner) {
            var countEl = document.getElementById('banner-solicitudes-count');
            if (countEl) countEl.textContent = count;
            if (count > 0) {
                banner.style.display = '';
            } else {
                banner.style.display = 'none';
            }
        }
    }

    // ── Carga inicial para ADMIN (badge sidebar + contador conectados) ─────
    if (rol === 'ADMIN') {
        fetch('/api/admin/solicitudes-pendientes-count', { credentials: 'same-origin' })
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(data) {
                if (!data) return;
                updateSolicitudesBadge(data.solicitudes);
                var el = document.getElementById('usuarios-conectados-count');
                if (el) el.textContent = data.conectados;
            }).catch(function() {});
    }

    // STOMP connection
    function connectWebSocket() {
        // Verificar que las librerías estén cargadas
        if (typeof SockJS === 'undefined' || typeof Stomp === 'undefined') {
            console.warn('[WS] SockJS o Stomp no cargadas, reintentando en 1s');
            setTimeout(connectWebSocket, 1000);
            return;
        }

        try {
            var socket = new SockJS('/ws');
            var stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect({}, function(frame) {
                console.log('[WS] Conectado como:', correo, '| frame:', frame);

                // Notificaciones personales
                stompClient.subscribe('/user/queue/notificaciones', function(message) {
                    console.log('[WS] Notificación recibida:', message.body);
                    try {
                        var data = JSON.parse(message.body);
                        unreadCount++;
                        updateBadge(unreadCount);
                        showToast(data.titulo, data.mensaje, data.tipo);
                    } catch(e) { console.error('[WS] Error parseando:', e); }
                });

                // Solicitudes pendientes (solo ADMIN)
                if (rol === 'ADMIN') {
                    stompClient.subscribe('/topic/admin/solicitudes', function(message) {
                        try {
                            var data = JSON.parse(message.body);
                            updateSolicitudesBadge(data.count);
                        } catch(e) {}
                    });

                    // Usuarios conectados en tiempo real (solo ADMIN)
                    stompClient.subscribe('/topic/admin/conectados', function(message) {
                        try {
                            var data = JSON.parse(message.body);
                            var el = document.getElementById('usuarios-conectados-count');
                            if (el) el.textContent = data.count;
                        } catch(e) {}
                    });
                }

                // Estado de estudios en tiempo real (todos los roles)
                stompClient.subscribe('/topic/estudios', function(message) {
                    try {
                        var data = JSON.parse(message.body);
                        var idEstudio = String(data.idEstudio);
                        var estado = data.estado;
                        // Si el estudio se deroga, ocultarlo de la lista de estudios
                        if (estado === 'DEROGADO') {
                            document.querySelectorAll('[data-estudio-id="' + idEstudio + '"]').forEach(function(card) {
                                card.style.transition = 'opacity 0.5s, transform 0.5s';
                                card.style.opacity = '0';
                                card.style.transform = 'scale(0.95)';
                                setTimeout(function() { card.remove(); }, 500);
                            });
                        }
                    } catch(e) {}
                });

            }, function(error) {
                console.warn('[WS] Error STOMP, reintentando en 5s:', error);
                setTimeout(connectWebSocket, 5000);
            });

            socket.onclose = function() {
                console.warn('[WS] Socket cerrado, reintentando en 5s');
                setTimeout(connectWebSocket, 5000);
            };
        } catch(e) {}
    }

    connectWebSocket();
})();
</script>


</html>
