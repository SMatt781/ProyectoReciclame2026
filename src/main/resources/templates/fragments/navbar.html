<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="navbar" class="flex justify-between items-center px-8 py-4 w-full h-20 docked top-0 sticky z-40 bg-[#f7f9fb]/80 dark:bg-slate-950/80 backdrop-blur-xl">

    <!-- Logo Header Area -->
    <div class="flex-shrink-0">
        <img alt="Reciclame Logo" th:src="@{/images/logo-reciclame.png}" class="h-8 object-contain" />
    </div>

    <!-- Right Side / Actions & Profile -->
    <div class="flex items-center gap-6 ml-auto">

        <!-- Notifications -->
        <a th:href="${usuarioRol == 'ADMIN' || usuarioRol == 'SUPERADMIN' ? '/admin/notificaciones' : (usuarioRol == 'SOCIO' ? '/socio/notificaciones' : '/visualizador/notificaciones')}"
           class="text-slate-500 dark:text-slate-400 hover:text-[#2ECC71] transition-colors relative inline-flex items-center justify-center">
            <svg class="w-6 h-6 text-current" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V2c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 3.36 6 5.92 6 9v5l-2 2v1h16v-1l-2-2z"/>
            </svg>

            <span th:if="${notificacionesNoLeidas != null and notificacionesNoLeidas > 0}"
                  th:text="${notificacionesNoLeidas}"
                  class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center border border-surface-container-lowest">
            </span>
        </a>

        <!-- Profile Card -->
        <div class="flex items-center gap-3 p-1 rounded-full hover:bg-surface-container-low transition-colors">
            <a th:href="@{/perfil}" class="flex items-center gap-3 p-1 rounded-full hover:bg-surface-container-low transition-colors">
                <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-sm ring-2 ring-surface-container-lowest shadow-sm"
                     th:text="${sessionUser != null ? sessionUser.iniciales : 'US'}">
                    US
                </div>
            </a>

            <div class="hidden md:flex flex-col justify-center">
                <span class="font-['Inter'] font-medium text-sm text-[#001B2E] dark:text-white leading-tight"
                      th:text="${sessionUser != null ? sessionUser.nombreCompleto : 'Usuario'}">
                    Usuario
                </span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full w-max mt-0.5 tracking-wider uppercase"
                      th:classappend="${sessionUser.rol == 'SUPERADMIN'} ? 'bg-purple-100 text-purple-700' :
                      (${sessionUser.rol == 'ADMIN'} ? 'bg-emerald-100 text-emerald-700' :
                      (${sessionUser.rol == 'SOCIO'} ? 'bg-blue-100 text-blue-700' :
                      'bg-slate-100 text-slate-600'))"
                      th:text="${sessionUser != null ? sessionUser.rol : 'ROL'}">
                    ROL
                </span>
            </div>
        </div>

    </div>

</header>
</html>
