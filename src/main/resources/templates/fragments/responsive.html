<style>
/* ============================================
   EXTENSIONES RESPONSIVE PARA TAILWIND
   ============================================ */

:root {
  --primary-color: #000000;
  --secondary-color: #006d37;
  --accent-color: #f59e0b;
  --danger-color: #ba1a1a;
  --success-color: #4ae183;
  
  --ambient-shadow: 0 4px 24px -4px rgba(0, 27, 46, 0.06);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.15);
}

/* Grid Responsivo */
.grid-responsive-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 1rem;
}

.grid-responsive-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1rem;
}

.grid-responsive-4 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
}

/* Tarjetas */
.card-responsive {
  background: white;
  border-radius: 0.75rem;
  padding: 1.5rem;
  box-shadow: var(--ambient-shadow);
  transition: all 0.3s ease;
  border: 1px solid rgba(195, 199, 205, 0.15);
}

.card-responsive:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

/* Tablas */
.table-responsive-wrapper {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 0.75rem;
}

.table-responsive {
  width: 100%;
  border-collapse: collapse;
  min-width: 600px;
  background: white;
}

.table-responsive thead {
  background-color: #f2f4f6;
}

.table-responsive th {
  padding: 0.75rem 1rem;
  text-align: left;
  font-weight: 600;
  font-size: 0.875rem;
  border-bottom: 1px solid #e0e3e5;
}

.table-responsive td {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid #e0e3e5;
}

.table-responsive tbody tr:hover {
  background-color: #f7f9fb;
}

/* Notificaciones */
.notification {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 1rem 1.5rem;
  border-radius: 0.5rem;
  box-shadow: var(--shadow-lg);
  z-index: 9999;
  animation: slideIn 0.3s ease;
  max-width: 400px;
}

@keyframes slideIn {
  from {
    transform: translateX(400px);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

.notification.success {
  background: #EAF3DE;
  color: #173404;
  border-left: 4px solid #4ae183;
}

.notification.error {
  background: #ffdad6;
  color: #93000a;
  border-left: 4px solid #ba1a1a;
}

.notification.warning {
  background: #fff3cd;
  color: #856404;
  border-left: 4px solid #f59e0b;
}

.notification.info {
  background: #d1ecf1;
  color: #0c5460;
  border-left: 4px solid #3b82f6;
}

/* Modales */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9998;
}

.modal-content {
  background: white;
  border-radius: 0.75rem;
  box-shadow: var(--shadow-lg);
  max-height: 90vh;
  overflow-y: auto;
  z-index: 9999;
  max-width: 600px;
  width: 90%;
}

.modal-header {
  padding: 1.5rem;
  border-bottom: 1px solid #e0e3e5;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-body {
  padding: 1.5rem;
}

.modal-footer {
  padding: 1.5rem;
  border-top: 1px solid #e0e3e5;
  display: flex;
  gap: 1rem;
  justify-content: flex-end;
}

/* Botones */
.btn-custom {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.625rem 1rem;
  border-radius: 0.5rem;
  font-weight: 500;
  font-size: 0.875rem;
  cursor: pointer;
  transition: all 0.3s ease;
  border: none;
  text-decoration: none;
  gap: 0.5rem;
}

.btn-custom:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}

.btn-primary {
  background: var(--primary-color);
  color: white;
}

.btn-primary:hover {
  background: rgba(0, 0, 0, 0.85);
}

.btn-secondary {
  background: var(--secondary-color);
  color: white;
}

.btn-secondary:hover {
  background: #005228;
}

.btn-outline {
  background: transparent;
  color: var(--primary-color);
  border: 1px solid var(--primary-color);
}

.btn-outline:hover {
  background: rgba(0, 0, 0, 0.05);
}

/* Alertas */
.alert {
  padding: 1rem 1.25rem;
  border-radius: 0.5rem;
  margin-bottom: 1rem;
  border-left: 4px solid;
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
}

.alert-info {
  background: #d1ecf1;
  border-color: #3b82f6;
  color: #0c5460;
}

.alert-success {
  background: #EAF3DE;
  border-color: #4ae183;
  color: #173404;
}

.alert-warning {
  background: #fff3cd;
  border-color: #f59e0b;
  color: #856404;
}

.alert-danger {
  background: #ffdad6;
  border-color: #ba1a1a;
  color: #93000a;
}

/* Badges */
.badge-custom {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  border-radius: 0.375rem;
  font-size: 0.75rem;
  font-weight: 600;
}

.badge-success {
  background: #EAF3DE;
  color: #173404;
}

.badge-warning {
  background: #fff3cd;
  color: #856404;
}

.badge-danger {
  background: #ffdad6;
  color: #93000a;
}

.badge-info {
  background: #d1ecf1;
  color: #0c5460;
}

/* Formularios */
.form-group {
  margin-bottom: 1.5rem;
}

.form-label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 600;
  font-size: 0.875rem;
  color: var(--primary-color);
}

.form-input,
.form-textarea,
.form-select {
  width: 100%;
  padding: 0.625rem 0.75rem;
  border: 1px solid #c3c7cd;
  border-radius: 0.5rem;
  font-size: 0.875rem;
  font-family: inherit;
  transition: all 0.3s ease;
}

.form-input:focus,
.form-textarea:focus,
.form-select:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
}

.form-help {
  display: block;
  margin-top: 0.375rem;
  font-size: 0.75rem;
  color: #73777d;
}

/* Spinners */
.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(0, 0, 0, 0.1);
  border-radius: 50%;
  border-top-color: var(--primary-color);
  animation: spin 0.8s ease-in-out infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* Utilidades */
.flex-center {
  display: flex;
  align-items: center;
  justify-content: center;
}

.flex-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.truncate-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Animaciones */
.fade-in {
  animation: fadeIn 0.3s ease-in;
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.slide-up {
  animation: slideUp 0.3s ease-out;
}

@keyframes slideUp {
  from {
    transform: translateY(10px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

/* Media Queries */
@media (max-width: 1024px) {
  .grid-responsive-2,
  .grid-responsive-3,
  .grid-responsive-4 {
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  }
}

@media (max-width: 768px) {
  .card-responsive {
    padding: 1rem;
  }

  .notification {
    top: 10px;
    right: 10px;
    left: 10px;
    max-width: none;
  }

  .modal-content {
    width: 95%;
  }
}

@media (max-width: 480px) {
  .grid-responsive-2,
  .grid-responsive-3,
  .grid-responsive-4 {
    grid-template-columns: 1fr;
  }

  .card-responsive {
    padding: 0.75rem;
  }

  .modal-content {
    width: 100%;
    border-radius: 0.5rem;
  }

  .modal-header,
  .modal-body,
  .modal-footer {
    padding: 1rem;
  }

  .table-responsive {
    font-size: 0.8rem;
  }

  .table-responsive th,
  .table-responsive td {
    padding: 0.5rem;
  }
}
</style>

<script>
/* ============================================
   RESPONSIVE HELPER - JAVASCRIPT
   ============================================ */

(function() {
  'use strict';

  window.ResponsiveHelpers = {

    isMobile: function() {
      return window.innerWidth <= 768;
    },
    
    isTablet: function() {
      return window.innerWidth > 768 && window.innerWidth <= 1024;
    },
    
    isDesktop: function() {
      return window.innerWidth > 1024;
    },
    
    getDeviceType: function() {
      if (this.isMobile()) return 'mobile';
      if (this.isTablet()) return 'tablet';
      return 'desktop';
    },

    getScreenWidth: function() {
      return window.innerWidth;
    },

    makeTableResponsive: function(tableSelector) {
      const tables = document.querySelectorAll(tableSelector);
      
      tables.forEach(table => {
        if (table.parentElement.classList.contains('table-responsive-wrapper')) {
          return;
        }

        const wrapper = document.createElement('div');
        wrapper.classList.add('table-responsive-wrapper');
        table.classList.add('table-responsive');
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      });
    },

    showNotification: function(message, type = 'info', duration = 3000) {
      const notification = document.createElement('div');
      notification.classList.add('notification', type);
      notification.innerHTML = `
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <span>${this._getIconForType(type)}</span>
          <span>${message}</span>
        </div>
      `;
      
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.style.animation = 'slideOut 0.3s ease forwards';
        setTimeout(() => notification.remove(), 300);
      }, duration);
    },

    _getIconForType: function(type) {
      const icons = {
        success: '✓',
        error: '✕',
        warning: '⚠',
        info: 'ℹ'
      };
      return icons[type] || 'ℹ';
    },

    createModal: function(title, content, options = {}) {
      const defaults = {
        closeable: true,
        size: 'md',
        onClose: null
      };
      
      const config = Object.assign({}, defaults, options);
      
      const overlay = document.createElement('div');
      overlay.classList.add('modal-overlay');
      
      const modalContent = document.createElement('div');
      modalContent.classList.add('modal-content', `modal-${config.size}`);
      
      const header = document.createElement('div');
      header.classList.add('modal-header');
      header.innerHTML = `
        <h3 style="margin: 0; font-weight: 600;">${title}</h3>
        ${config.closeable ? '<button style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">×</button>' : ''}
      `;
      
      const body = document.createElement('div');
      body.classList.add('modal-body');
      body.innerHTML = typeof content === 'string' ? content : '';
      
      modalContent.appendChild(header);
      modalContent.appendChild(body);
      overlay.appendChild(modalContent);
      
      document.body.appendChild(overlay);
      
      const closeBtn = header.querySelector('button');
      const closeModal = () => {
        overlay.remove();
        if (config.onClose) config.onClose();
      };
      
      if (closeBtn) closeBtn.addEventListener('click', closeModal);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeModal();
      });
      
      const handleEsc = (e) => {
        if (e.key === 'Escape') {
          closeModal();
          document.removeEventListener('keydown', handleEsc);
        }
      };
      document.addEventListener('keydown', handleEsc);
      
      return { overlay, modalContent, close: closeModal };
    },

    validateForm: function(formSelector) {
      const form = document.querySelector(formSelector);
      if (!form) return false;
      
      const inputs = form.querySelectorAll('[required]');
      let isValid = true;
      
      inputs.forEach(input => {
        if (!input.value.trim()) {
          input.style.borderColor = '#ba1a1a';
          input.style.boxShadow = '0 0 0 3px rgba(186, 26, 26, 0.1)';
          isValid = false;
        } else {
          input.style.borderColor = '';
          input.style.boxShadow = '';
        }
      });
      
      return isValid;
    },

    formatNumber: function(num, locale = 'es-ES') {
      return new Intl.NumberFormat(locale).format(num);
    },
    
    formatCurrency: function(num, currency = 'USD', locale = 'es-ES') {
      return new Intl.NumberFormat(locale, {
        style: 'currency',
        currency: currency
      }).format(num);
    },
    
    formatDate: function(date, format = 'short', locale = 'es-ES') {
      if (typeof date === 'string') date = new Date(date);
      
      const options = {
        short: { year: 'numeric', month: '2-digit', day: '2-digit' },
        long: { year: 'numeric', month: 'long', day: 'numeric' },
        full: { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' },
        time: { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }
      };
      
      return new Intl.DateTimeFormat(locale, options[format] || options.short).format(date);
    },

    lazyLoadImages: function() {
      if ('IntersectionObserver' in window) {
        const images = document.querySelectorAll('img[data-src]');
        const imageObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const img = entry.target;
              img.src = img.dataset.src;
              img.removeAttribute('data-src');
              img.classList.add('fade-in');
              imageObserver.unobserve(img);
            }
          });
        }, { rootMargin: '50px' });
        
        images.forEach(img => imageObserver.observe(img));
      }
    },

    observeElements: function(selector, className = 'slide-up', threshold = 0.1) {
      if ('IntersectionObserver' in window) {
        const elements = document.querySelectorAll(selector);
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add(className);
              observer.unobserve(entry.target);
            }
          });
        }, { threshold });
        
        elements.forEach(el => observer.observe(el));
      }
    },

    copyToClipboard: function(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          this.showNotification('Copiado al portapapeles', 'success', 2000);
        });
      }
    },

    fetchData: async function(url, options = {}) {
      try {
        const response = await fetch(url, options);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return await response.json();
      } catch (error) {
        console.error('Error al obtener datos:', error);
        this.showNotification('Error al obtener datos', 'error');
        return null;
      }
    },

    truncateText: function(text, maxLength = 50) {
      if (text.length <= maxLength) return text;
      return text.substring(0, maxLength) + '...';
    },

    debounce: function(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    },

    init: function(options = {}) {
      const config = {
        autoTableResponsive: true,
        autoLazyLoad: true,
        autoObserveCards: true,
        ...options
      };

      if (config.autoTableResponsive) {
        this.makeTableResponsive('table');
      }

      if (config.autoLazyLoad) {
        this.lazyLoadImages();
      }

      if (config.autoObserveCards) {
        this.observeElements('.card-responsive');
      }

      console.log('ResponsiveHelpers inicializado en:', this.getDeviceType());
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      ResponsiveHelpers.init();
    });
  } else {
    ResponsiveHelpers.init();
  }

})();
</script>
