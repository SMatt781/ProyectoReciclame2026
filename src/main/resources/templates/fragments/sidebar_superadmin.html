<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar"
       class="hidden md:flex flex-col h-full w-64 p-5 border-none bg-[#f2f4f6] dark:bg-slate-900 z-50">

  <!-- Brand / Header -->
  <div class="flex items-center gap-3 mb-10 pl-2">
    <div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center flex-shrink-0">
      <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
        <path
                d="M7 19c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2v-8h4V9h-4V7c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H3v2h4v8zm2-8h6V7H9v4z" />
      </svg>
    </div>

    <div class="flex flex-col">
      <h1 class="text-[#001B2E] dark:text-white font-black text-xl font-headline tracking-tight">
        Reciclame
      </h1>
      <span class="text-xs text-on-surface-variant font-medium">Superadmin</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 space-y-0.5">

    <a class="text-slate-600 dark:text-slate-400 hover:bg-[#2ECC71]/20 hover:text-[#00743a] dark:hover:bg-[#2ECC71]/20 dark:hover:text-[#6bfe9c] rounded-xl px-4 py-2.5 flex items-center gap-3 transition-all scale-95 active:scale-100 active:bg-[#2ECC71]/30 font-headline font-bold text-sm tracking-tight"
       th:classappend="${currentSection == 'superadmin-dashboard'} ? ' bg-[#2ECC71]/20 text-[#00743a] dark:text-[#6bfe9c]' : ''"
       th:href="@{/superadmin/dashboard}">
      <svg class="w-5 h-5 text-current flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
      Dashboard
    </a>

    <a class="text-slate-600 dark:text-slate-400 hover:bg-[#2ECC71]/20 hover:text-[#00743a] dark:hover:bg-[#2ECC71]/20 dark:hover:text-[#6bfe9c] rounded-xl px-4 py-2.5 flex items-center gap-3 transition-all scale-95 active:scale-100 active:bg-[#2ECC71]/30 font-headline font-bold text-sm tracking-tight"
       th:classappend="${currentSection == 'superadmin-usuarios'} ? ' bg-[#2ECC71]/20 text-[#00743a] dark:text-[#6bfe9c]' : ''"
       th:href="@{/admin/usuarios/gestion}">
      <span class="material-symbols-outlined text-[20px]">group</span>
      Usuarios
    </a>

    <a class="text-slate-600 dark:text-slate-400 hover:bg-[#2ECC71]/20 hover:text-[#00743a] dark:hover:bg-[#2ECC71]/20 dark:hover:text-[#6bfe9c] rounded-xl px-4 py-2.5 flex items-center gap-3 transition-all scale-95 active:scale-100 active:bg-[#2ECC71]/30 font-headline font-bold text-sm tracking-tight"
       th:classappend="${currentSection == 'superadmin-administradores'} ? ' bg-[#2ECC71]/20 text-[#00743a] dark:text-[#6bfe9c]' : ''"
       th:href="@{/superadmin/administradores}">
      <span class="material-symbols-outlined text-[20px]">admin_panel_settings</span>
      Administradores
    </a>

    <a class="text-slate-600 dark:text-slate-400 hover:bg-[#2ECC71]/20 hover:text-[#00743a] dark:hover:bg-[#2ECC71]/20 dark:hover:text-[#6bfe9c] rounded-xl px-4 py-2.5 flex items-center gap-3 transition-all scale-95 active:scale-100 active:bg-[#2ECC71]/30 font-headline font-bold text-sm tracking-tight"
       th:classappend="${currentPage == 'superadmin-estudios'} ? ' bg-[#2ECC71]/20 text-[#00743a] dark:text-[#6bfe9c]' : ''"
       th:href="@{/estudios}">
      <div th:replace="~{fragments/icons.html :: icon-estudios-sidebar}"></div>
      Estudios
    </a>

    <a class="text-slate-600 dark:text-slate-400 hover:bg-[#2ECC71]/20 hover:text-[#00743a] dark:hover:bg-[#2ECC71]/20 dark:hover:text-[#6bfe9c] rounded-xl px-4 py-2.5 flex items-center gap-3 transition-all scale-95 active:scale-100 active:bg-[#2ECC71]/30 font-headline font-bold text-sm tracking-tight"
       th:classappend="${currentPage == 'superadmin-repoNormativo'} ? ' bg-[#2ECC71]/20 text-[#00743a] dark:text-[#6bfe9c]' : ''"
       th:href="@{/normativas}">
      <div th:replace="~{fragments/icons.html :: icon-normativas-sidebar}"></div>
      Repositorio Normativo
    </a>

    <a class="text-slate-600 dark:text-slate-400 hover:bg-[#2ECC71]/20 hover:text-[#00743a] dark:hover:bg-[#2ECC71]/20 dark:hover:text-[#6bfe9c] rounded-xl px-4 py-2.5 flex items-center gap-3 transition-all scale-95 active:scale-100 active:bg-[#2ECC71]/30 font-headline font-bold text-sm tracking-tight"
       th:classappend="${currentSection == 'superadmin-estado-sistema'} ? ' bg-[#2ECC71]/20 text-[#00743a] dark:text-[#6bfe9c]' : ''"
       th:href="@{/superadmin/estadoSistema}">
      <span class="material-symbols-outlined text-[20px]">monitor_heart</span>
      Estado del Monitor
    </a>

    <a class="text-slate-600 dark:text-slate-400 hover:bg-[#2ECC71]/20 hover:text-[#00743a] dark:hover:bg-[#2ECC71]/20 dark:hover:text-[#6bfe9c] rounded-xl px-4 py-2.5 flex items-center gap-3 transition-all scale-95 active:scale-100 active:bg-[#2ECC71]/30 font-headline font-bold text-sm tracking-tight"
       th:classappend="${currentSection == 'superadmin-conf-seguridad'} ? ' bg-[#2ECC71]/20 text-[#00743a] dark:text-[#6bfe9c]' : ''"
       th:href="@{/superadmin/confSeguridad}">
      <span class="material-symbols-outlined text-[20px]">security</span>
      Configuración de Seguridad
    </a>

  </nav>

  <!-- Footer -->
  <div class="pt-4 space-y-2 relative before:absolute before:top-0 before:left-4 before:right-4 before:h-px before:bg-surface-variant">
    <form th:action="@{/logout}" method="post" class="w-full">
      <button type="submit"
              class="w-full text-slate-600 dark:text-slate-400 hover:bg-[#2ECC71]/20 hover:text-[#00743a] dark:hover:bg-[#2ECC71]/20 dark:hover:text-[#6bfe9c] rounded-xl px-4 py-2.5 flex items-center gap-3 transition-all scale-95 active:scale-100 active:bg-[#2ECC71]/30 font-headline font-bold text-sm tracking-tight">
        <span class="material-symbols-outlined text-[20px]">logout</span>
        Cerrar Sesión
      </button>
    </form>
  </div>

</aside>

</body>
</html>
