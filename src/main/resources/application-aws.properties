# ========== Configuración AWS (PRODUCCIÓN) ==========
# Base de datos, mail, recaptcha, etc. se heredan de application.properties

# ========== FILE UPLOAD CONFIGURATION (S3) ==========
storage.type=s3
# Los demás valores se ignoran en modo S3

# ========== AWS S3 (credenciales vienen de variables de ambiente) ==========
# aws.s3.access-key=${AWS_ACCESS_KEY_ID}
# aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
# aws.s3.session-token=${AWS_SESSION_TOKEN}
# Las credenciales se cargan automáticamente del contexto de AWS

aws.s3.bucket-name=reciclame-documentos-pucp-2026
aws.s3.region=us-east-1
aws.s3.presigned-duration=900

app.env=AWS
